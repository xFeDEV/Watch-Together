version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: watchtogether-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: watchtogether-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      - VITE_STUN_SERVER=${VITE_STUN_SERVER:-stun:stun.l.google.com:19302}
      - VITE_TURN_SERVER=${VITE_TURN_SERVER}
      - VITE_TURN_USERNAME=${VITE_TURN_USERNAME}
      - VITE_TURN_PASSWORD=${VITE_TURN_PASSWORD}
    depends_on:
      - backend
    restart: unless-stopped
